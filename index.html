<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTMC Staff ID Card Maker</title>
<style>
*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{margin:0;font:14px Calibri,Carlito,Arial,sans-serif;background:#f3f5fa;color:#0b1f4b;display:flex;height:100vh}
.ui{width:350px;flex:none;padding:14px;overflow:auto;background:#fff;border-right:1px solid #d5dbe8}
.ui h1{font-size:18px;margin:0 0 6px}.ui h2{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#5a6b8c;margin:16px 0 4px;border-top:1px solid #e3e8f3;padding-top:10px}
label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:5px 0;font-size:13px}
input[type=text],textarea,select{width:200px;padding:5px;border:1px solid #c5cde0;border-radius:5px;font:inherit}
textarea{height:56px}input[type=color]{width:46px;height:26px;padding:0;border:0;background:none}
button{padding:7px 10px;border:0;border-radius:6px;background:#1b4fbf;color:#fff;font:inherit;cursor:pointer;margin:2px 2px 2px 0}button.g{background:#e6ebf7;color:#0b1f4b}
.ex{display:flex;gap:4px;margin:4px 0}.ex input{width:0;flex:1;padding:5px;border:1px solid #c5cde0;border-radius:5px}
.main{flex:1;overflow:auto;padding:24px;display:flex;gap:30px;flex-wrap:wrap;justify-content:center;align-content:flex-start}
.cap{text-align:center;font-size:12px;color:#5a6b8c;margin-bottom:6px;letter-spacing:.1em}
.pv{zoom:2.4}
.card{width:54mm;height:85.6mm;position:relative;overflow:hidden;background:#fff;color:var(--tx);display:flex;flex-direction:column;box-shadow:0 0 .4mm #0006;font-family:Calibri,Carlito,Arial,sans-serif}
.hd{background:var(--navy);color:#fff;text-align:center;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1mm;position:relative;z-index:1}
.disc{border-radius:50%;background:#fff;border:.45mm solid var(--royal);overflow:hidden}.disc img{width:100%;height:100%;object-fit:cover;display:block}
.sn{font:bold 7.5pt/1.15 var(--hf);white-space:pre-line}.sub{font-size:5pt;color:#bfd4ff;letter-spacing:.06em}
.bd{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:2.6mm 3mm 0;gap:1.3mm;min-height:0}
.wm{position:absolute;left:0;width:54mm;z-index:0}
.ph{border:.5mm solid var(--royal);background:#e8eefb center/cover;display:flex;align-items:center;justify-content:center;font:bold 6pt sans-serif;color:var(--royal);letter-spacing:.3em;flex:none}
.nm{font:bold 8pt/1.15 var(--hf);text-align:center}
.pl{background:var(--red);color:#fff;font:bold 6pt/1.2 sans-serif;letter-spacing:.1em;padding:.9mm 1mm;width:100%;text-align:center;border-radius:1mm}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:.8mm 1mm;width:100%;text-align:center}.fg small{display:block;font:bold 4.5pt sans-serif;color:#5a6b8c;letter-spacing:.15em}.fg b{font-size:6.5pt}
.rs{font:bold 7pt/1.3 sans-serif;text-align:center;white-space:pre-line}
.sg{width:100%;height:14mm;border:.3mm solid var(--royal);border-radius:1mm;background:#fff}
.cp{font:bold 4.8pt sans-serif;color:#5a6b8c;letter-spacing:.15em;text-align:center}
.nt{font-size:5.3pt;text-align:center;line-height:1.3}.nt b{display:block;color:var(--red);font-size:5.5pt;letter-spacing:.15em}
.ft{height:4.6mm;flex:none;background:var(--red);color:#fff;font:bold 5.5pt/4.6mm sans-serif;text-align:center;letter-spacing:.3em;position:relative;z-index:1}
.sec{display:none}.ui[data-tab=c] .sec.c,.ui[data-tab=s] .sec.s{display:block}.tabs{display:flex;gap:4px;margin:10px 0}.tabs button{flex:1;background:#e6ebf7;color:#0b1f4b}.ui[data-tab=c] [data-tab=c],.ui[data-tab=s] [data-tab=s]{background:#0b1f4b;color:#fff}.hint{font-size:12px;color:#5a6b8c;margin:6px 0}input[type=number]{width:200px;padding:5px;border:1px solid #c5cde0;border-radius:5px;font:inherit}
@page{size:54mm 85.6mm;margin:0}
@media print{.ui,.cap{display:none}body{display:block;height:auto;background:none}.main{padding:0;display:block;overflow:visible}.pv{zoom:1}.card{box-shadow:none}.pv+.pv{break-before:page}body.pf #bk,body.pb #fr{display:none}}
</style></head><body>
<div class="ui" id="ui"></div>
<div class="main"><div><div class="cap">FRONT</div><div class="pv" id="fr"></div></div><div><div class="cap">BACK</div><div class="pv" id="bk"></div></div></div>

const head=`<div class=hd style="height:${hd}mm">${S.hl?`<div class=disc style="width:${dd}mm;height:${dd}mm"><img src="${S.logo}"></div>`:''}<div class=sn>${esc(S.n1)}\n${esc(S.n2)}</div><div class=sub>${esc(S.loc)}${S.sm&&S.motto?'  |  '+esc(S.motto):''}</div></div>`;
const wm=S.wm?`<img class=wm src="${S.logo}" style="top:${hd}mm;opacity:${S.wmo/100}">`:'';
let b;
if(front){const sq=S.shape=='circle',f=[S.sid&&[S.idl,S.id],S.sv&&[S.vl,S.val],...S.extra.map(e=>[e.l,e.v])].filter(Boolean);
const ex=Math.max(0,Math.ceil(f.length/2)-1)*4.5;
b=`<div class=bd><div class=ph style="width:${sq?24-ex:22}mm;height:${sq?24-ex:27-ex}mm;border-radius:${sq?'50%':S.shape=='rounded'?'2mm':'0'};${S.photo?`background-image:url(${S.photo})`:''}">${S.photo?'':'PHOTO'}</div><div class=nm>${esc(S.name)}</div><div class=pl>${esc(S.des)}</div>${f.length?'<div class=fg>'+f.map(x=>`<div><small>${esc(x[0])}</small><b>${esc(x[1])}</b></div>`).join('')+'</div>':''}</div>`}
else b=`<div class=bd style="justify-content:space-evenly;padding-top:0"><div class=rs>${esc(S.ret)}</div>${S.ssg?`<div style="width:100%"><div class=sg></div><div class=cp style="margin-top:1mm">${esc(S.sigc)}</div></div>`:''}${S.snt?`<div class=nt><b>${esc(S.nh)}</b>${esc(S.nt)}</div>`:''}</div>`;
return`<div class=card>${wm}${head}${b}<div class=ft>${esc(front?S.ft1:S.ft2)}</div></div>`}
function render(){const s=document.documentElement.style;s.setProperty('--navy',S.navy);s.setProperty('--royal',S.royal);s.setProperty('--red',S.red);s.setProperty('--tx',S.tx);s.setProperty('--hf',`'${S.hf}',Caladea,Carlito,serif`);
$('fr').innerHTML=card(1);$('bk').innerHTML=card(0);
const z=$('sz');if(z)z.textContent=`Output: ${S.ow} × ${(S.ow*85.6/54).toFixed(1)} mm = ${Math.round(S.ow/25.4*S.dpi)} × ${Math.round(S.ow*85.6/54/25.4*S.dpi)} px`;
try{const o=Object.assign({},S);o.photo='';localStorage.setItem('gtmcid',JSON.stringify(o))}catch(e){}}
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;
if(k){S[k]=t.type=='checkbox'?+t.checked:t.type=='range'||t.type=='number'?+t.value:t.value}
else if(t.dataset.ei!==undefined)S.extra[t.dataset.ei][t.dataset.ef]=t.value;
else if(t.id=='pf'&&t.files[0])return rd(t.files[0],v=>{S.photo=v;render()});
else if(t.id=='lf'&&t.files[0])return rd(t.files[0],v=>{S.logo=v;render()});
else return;render()});
document.addEventListener('click',e=>{const t=e.target;
if(t.dataset.tab){window.TAB=t.dataset.tab;$('ui').dataset.tab=t.dataset.tab;return}
if(t.dataset.dl!==undefined)return dl();
if(t.id=='add'){S.extra.push({l:'LABEL',v:'Value'});$('ex').innerHTML=exHTML();render()}
else if(t.dataset.rm!==undefined){S.extra.splice(t.dataset.rm,1);$('ex').innerHTML=exHTML();render()}
else if(t.dataset.p!==undefined){document.body.className=t.dataset.p;window.print();setTimeout(()=>document.body.className='',500)}
else if(t.id=='rs'&&confirm('Reset every setting?')){try{localStorage.removeItem('gtmcid')}catch(x){}S=JSON.parse(JSON.stringify(D));buildUI();render()}});

const MP=96/25.4,CW=54,CH=85.6,pxW=()=>Math.round(S.ow/25.4*S.dpi),pxH=()=>Math.round(S.ow*CH/CW/25.4*S.dpi);
function xhtml(front){const d=document.createElement('div');d.setAttribute('style',`--navy:${S.navy};--royal:${S.royal};--red:${S.red};--tx:${S.tx};--hf:'${S.hf}',Caladea,Carlito,serif`);const st=document.createElement('style');st.textContent=document.querySelector('style').textContent;d.appendChild(st);const w=document.createElement('div');w.innerHTML=card(front);d.appendChild(w.firstChild);return new XMLSerializer().serializeToString(d)}
function raster(front,type){return new Promise(res=>{const W=pxW(),H=pxH(),vw=CW*MP,vh=CH*MP;const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${vw} ${vh}"><foreignObject width="${vw}" height="${vh}">${xhtml(front)}</foreignObject></svg>`;const im=new Image;im.onload=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(im,0,0,W,H);c.toBlob(res,type,.93)};im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)})}
function pdf(jp,W,H,wp,hp){const en=new TextEncoder(),P=[],off=[];let n=0;const add=x=>{const b=typeof x=='string'?en.encode(x):x;P.push(b);n+=b.length};
const ob=(id,body,bin)=>{off[id]=n;add(`${id} 0 obj\n${body}`);if(bin){add(bin);add('\nendstream')}add('\nendobj\n')};
add('%PDF-1.4\n');ob(1,'<< /Type /Catalog /Pages 2 0 R >>');ob(2,`<< /Type /Pages /Count ${jp.length} /Kids [${jp.map((_,i)=>`${3+3*i} 0 R`).join(' ')}] >>`);
jp.forEach((b,i)=>{const p=3+3*i,c=p+1,m=p+2,ct=`q ${wp.toFixed(2)} 0 0 ${hp.toFixed(2)} 0 0 cm /Im0 Do Q`;
ob(p,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${wp.toFixed(2)} ${hp.toFixed(2)}] /Contents ${c} 0 R /Resources << /XObject << /Im0 ${m} 0 R >> >> >>`);
ob(c,`<< /Length ${ct.length} >>\nstream\n${ct}\nendstream`);
ob(m,`<< /Type /XObject /Subtype /Image /Width ${W} /Height ${H} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${b.length} >>\nstream\n`,b)});
const xr=n,N=3+3*jp.length;add(`xref\n0 ${N}\n0000000000 65535 f \n`+off.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${N} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);return new Blob(P,{type:'application/pdf'})}
function vec(front){const host=document.createElement('div');host.style.cssText='position:fixed;left:-9999px;top:0';host.innerHTML=card(front);document.body.appendChild(host);
const root=host.firstChild,O=root.getBoundingClientRect();let o='',d='',k=0;const f=v=>+v.toFixed(2),q=v=>String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'),al=c=>{const m=c.match(/[\d.]+/g);return m&&m.length>3?+m[3]:1};
(function walk(e){const cs=getComputedStyle(e);if(cs.display=='none')return;const r=e.getBoundingClientRect(),x=r.left-O.left,y=r.top-O.top,w=r.width,h=r.height,bw=parseFloat(cs.borderTopWidth)||0,rad=cs.borderTopLeftRadius,rd=rad.includes('%'),rx=rd?w/2:parseFloat(rad)||0,ry=rd?h/2:rx;
const geo=`x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="${f(rx)}" ry="${f(ry)}"`;
if(al(cs.backgroundColor)>0||bw){o+=`<rect x="${f(x+bw/2)}" y="${f(y+bw/2)}" width="${f(w-bw)}" height="${f(h-bw)}" rx="${f(Math.max(0,rx-bw/2))}" ry="${f(Math.max(0,ry-bw/2))}" fill="${al(cs.backgroundColor)>0?cs.backgroundColor:'none'}"${bw?` stroke="${cs.borderTopColor}" stroke-width="${f(bw)}"`:''}/>`}
const bi=(cs.backgroundImage.match(/url\("?(.*?)"?\)$/)||[])[1],src=e.tagName=='IMG'?e.src:bi;
if(src){const id='k'+k++,pr=e.tagName=='IMG'?getComputedStyle(e.parentNode):cs,pd=pr.borderTopLeftRadius.includes('%'),pr2=e.tagName=='IMG'?e.parentNode.getBoundingClientRect():r;
d+=`<clipPath id="${id}">${pd?`<ellipse cx="${f(pr2.left-O.left+pr2.width/2)}" cy="${f(pr2.top-O.top+pr2.height/2)}" rx="${f(pr2.width/2)}" ry="${f(pr2.height/2)}"/>`:`<rect ${geo}/>`}</clipPath>`;
o+=`<image xlink:href="${src}" ${geo.replace(/ r[xy]="[^"]*"/g,'')} preserveAspectRatio="xMidYMid slice" opacity="${cs.opacity}" clip-path="url(#${id})"/>`}
e.childNodes.forEach(t=>{if(t.nodeType!=3||!t.textContent.trim())return;const R=document.createRange(),ls=[],fs=parseFloat(cs.fontSize);
for(let i=0;i<t.length;i++){R.setStart(t,i);R.setEnd(t,i+1);const g=R.getClientRects()[0];if(!g||!g.width)continue;let L=ls.find(l=>Math.abs(l.t-g.top)<2);if(/\s/.test(t.data[i])&&!(L&&L.s))continue;if(!L)ls.push(L={t:g.top,b:g.bottom,x:g.left,s:''});L.s+=t.data[i]}
ls.forEach(l=>{o+=`<text x="${f(l.x-O.left)}" y="${f(l.b-O.top-fs*.22)}" font-family="${q(cs.fontFamily)}" font-size="${f(fs)}" font-weight="${cs.fontWeight}" font-style="${cs.fontStyle}" letter-spacing="${parseFloat(cs.letterSpacing)||0}" fill="${cs.color}">${q(l.s.trimEnd())}</text>`})});
[...e.children].forEach(walk)})(root);
document.body.removeChild(host);const m=[S.ow,S.ow*CH/CW];
return `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${f(m[0])}mm" height="${f(m[1])}mm" viewBox="0 0 ${f(O.width)} ${f(O.height)}"><defs><clipPath id="cc"><rect width="${f(O.width)}" height="${f(O.height)}"/></clipPath>${d}</defs><g clip-path="url(#cc)">${o}</g></svg>`}
const save=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click()},wait=ms=>new Promise(r=>setTimeout(r,ms));
async function dl(){const sd=S.sides=='Front only'?[1]:S.sides=='Back only'?[0]:[1,0],nm=(S.name||'card').replace(/[^\w]+/g,'_');
try{if(S.fmt=='PDF'){const bl=[];for(const f of sd)bl.push(new Uint8Array(await(await raster(f,'image/jpeg')).arrayBuffer()));save(pdf(bl,pxW(),pxH(),S.ow*72/25.4,S.ow*CH/CW*72/25.4),nm+'.pdf');return}
for(const f of sd){const t=f?'front':'back';if(S.fmt=='SVG')save(new Blob([vec(f)],{type:'image/svg+xml'}),`${nm}_${t}.svg`);else{const j=S.fmt=='JPG';save(await raster(f,j?'image/jpeg':'image/png'),`${nm}_${t}.${j?'jpg':'png'}`)}await wait(400)}}catch(x){alert('Export failed: '+x.message+'. Try Chrome or Edge.')}}
buildUI();render();
</script></body></html>
